[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsed"
version = "0.1.0"
description = "Detect OP/ED segments in a local anime folder and write lossless chapters into MP4/MKV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anime", "chapters", "op", "ed", "skip", "mp4", "mkv", "ffmpeg", "mkvtoolnix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
opsed = "opsed.cli:main"

[project.urls]
Homepage = "https://github.com/Pxmy996/opsed"
Repository = "https://github.com/Pxmy996/opsed"
Issues = "https://github.com/Pxmy996/opsed/issues"

[tool.setuptools]
packages = ["opsed"]
